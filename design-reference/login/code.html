<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .ambient-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

            box-shadow: 0 0 0 3px theme('colors.primary-container');
        }

<body class="min-h-screen flex items-center justify-center p-gutter">
<!-- Login Card -->
<main class="bg-surface-container-lowest w-full max-w-md rounded-xl ambient-shadow p-card-padding sm:p-[40px] flex flex-col items-center">
<!-- Logo / Title -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-primary-container/10 rounded-lg flex items-center justify-center mb-4 text-primary">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">
                    calendar_month
                </span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary text-center">Smart Meeting</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">Enterprise Suite</p>
</div>
<!-- Form -->
<form action="../_/code.html" class="w-full flex flex-col gap-stack-gap" method="POST" onsubmit="event.preventDefault(); window.location.href='../_/code.html';">
<!-- Email Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">อีเมล (Email)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl pointer-events-none">
                        mail
                    </span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all input-glow" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1 mt-2">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">รหัสผ่าน (Password)</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="../forgot_password/code.html">ลืมรหัสผ่าน?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl pointer-events-none">
                        lock
                    </span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all input-glow" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Options -->
<div class="flex items-center mt-2 mb-4">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface" id="remember" type="checkbox">
<label class="ml-2 font-body-md text-body-md text-on-surface-variant" for="remember">จดจำการเข้าสู่ระบบ</label>
</div>
<!-- CTA -->
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg font-medium py-3 rounded-lg hover:bg-surface-tint active:scale-[0.98] transition-all shadow-sm" type="submit">
                เข้าสู่ระบบ
            </button>
</form>
</main>
</body></html>
